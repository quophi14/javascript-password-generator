<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator - Personal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Generate A <br><span>Random Password</span></h1>
        <div class="display">
            <input type="text" id="password" placeholder="Password" readonly>
            <img src="images/copy.png" alt="" onclick="copyPassword()">
            <p id="copy-message" style="display: none;"></p>
        </div>
        <button onclick="createPassword()"><img src="images/generate.png" alt="">Generate</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
